<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calagem</title>
    <link rel="stylesheet" href="./css/main.css"/>
</head>
<body>
    <div id="simulacao-container"></div>
    <div id="legenda">
        <img src="./images/32x/agua.png"/>              <p>H<sub>2</sub>O - Água</p>
        <img src="./images/32x/aluminio.png"/>          <p>Al<sup>3+</sup> - Alumínio</p>
        <img src="./images/32x/calcario.png"/>          <p>CaCO<sub>3</sub> - Calcário</p>
        <img src="./images/32x/calcio.png"/>            <p>Ca<sup>2+</sup> - Cálcio</p>
        <img src="./images/32x/carbonato.png"/>         <p>CO<sub>3</sub> - Carbonato</p>
        <img src="./images/32x/dioxidoCarbono.png"/>    <p>CO<sub>2</sub> - Dióxido de Carbono</p>
        <img src="./images/32x/hidrogenio.png"/>        <p>H<sup>+</sup> - Hidrogênio</p>
        <img src="./images/32x/hidroxidoAluminio.png"/> <p>Al(OH)<sub>3</sub> - Hidróxido de Alumínio</p>
    </div>

    <div class="corpo-texto">

    <div class="corpo-texto">

        <!-- CaCO3 <=> Ca^2+ + CO3^2- -->
        <div class="formula">
            <img class="quimico" src="./images/calcario.png" alt="CaCO3"/>
            &rightleftharpoons;
            <img class="quimico" src="./images/calcio.png" alt="Ca2+"/>
            +
            <div class="componente">
                <img class="quimico" src="./images/carbonato.png" alt="CO3"/>
                <sup>2-</sup>
            </div>
        </div>

        <!-- CO3^2- + 2H^+ -> CO2 + H2O -->
        <div class="formula">
            <div class="componente">
                <img class="quimico" src="./images/carbonato.png" alt="CO3"/>
                <sup>2-</sup>
            </div>
            + 
            2 <img class="quimico" src="./images/hidrogenio.png" alt="H"/>
            &xrarr;
            <img class="quimico" src="./images/dioxidoCarbono.png" alt="CO2"/>
            +
            <img class="quimico" src="./images/agua.png" alt="H2O"/>
        </div>

        <!-- Al^3 + 3OH^- -> Al(OH)3 -->
        <div class="formula">
            <img class="quimico" src="./images/aluminio.png"/>
            + <span id="hidroxido">3OH<sup>-</sup></span>
            &xrarr;
            <img class="quimico" src="./images/hidroxidoAluminio.png"/>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
